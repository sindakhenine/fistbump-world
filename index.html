<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fistbump</title>
    <meta
      name="description"
      content="Fistbump, a new app for builders, is coming soon."
    />
    <meta name="theme-color" content="#FAFBF6" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://fistbump.world/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fistbump.world/" />
    <meta property="og:site_name" content="Fistbump" />
    <meta property="og:title" content="Fistbump" />
    <meta property="og:description" content="A new app for builders, coming soon." />
    <meta property="og:image" content="https://fistbump.world/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A small parachute drifting down with a crate stamped with the Fistbump mark."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@skatalystai" />
    <meta name="twitter:title" content="Fistbump" />
    <meta name="twitter:description" content="A new app for builders, coming soon." />
    <meta name="twitter:image" content="https://fistbump.world/og.png" />
    <!-- The colours: the same chart as the app (src/theme/tokens.css). -->
    <link rel="stylesheet" href="/tokens.css" />
    <link
      rel="preload"
      href="/fonts/BricolageGrotesque_800ExtraBold.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <style>
      @font-face {
        font-family: 'Bricolage Grotesque';
        src: url('/fonts/BricolageGrotesque_800ExtraBold.ttf') format('truetype');
        font-weight: 800;
        font-display: swap;
      }
      @font-face {
        font-family: 'Manrope';
        src: url('/fonts/Manrope_500Medium.ttf') format('truetype');
        font-weight: 500;
        font-display: swap;
      }
      @font-face {
        font-family: 'Manrope';
        src: url('/fonts/Manrope_800ExtraBold.ttf') format('truetype');
        font-weight: 800;
        font-display: swap;
      }
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100svh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: var(--paper);
        color: var(--forest);
        font:
          500 16px/1.5 Manrope,
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      /* The logo sits where the app's does, with the same margin. */
      header,
      footer {
        padding: clamp(16px, 3svh, 26px) clamp(16px, 4vw, 40px);
      }
      footer {
        justify-content: flex-end;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--forest);
        text-decoration: none;
        font:
          800 24px/1 Manrope,
          system-ui,
          sans-serif;
        letter-spacing: -1.4px;
      }
      .brand img {
        width: 32px;
        height: 32px;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 8px 16px 24px;
      }
      /* The app's own 3D parachute (the one members land with), carrying the Fistbump logo on a
         round shiny badge. When it lands the logo lights up in gold, like the owner's video. */
      .sky {
        width: min(230px, 26svh, 50vw);
      }
      .parachute {
        position: relative;
        display: block;
        aspect-ratio: 286 / 360;
        transform-origin: 50% 14%;
        animation:
          drop 2.8s cubic-bezier(0.2, 0.75, 0.25, 1) both,
          sway 4.8s ease-in-out 2.8s infinite;
      }
      .chute {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 10px 14px #1e3a2c26);
      }
      /* Drawn in the picture's own units (286 wide), so the strings meet the badge. */
      .badge {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: auto;
        overflow: visible;
      }
      .badge-ball {
        filter: drop-shadow(0 8px 10px #1e3a2c40);
      }
      .badge-light {
        animation:
          light-up 1.1s cubic-bezier(0.2, 1.4, 0.4, 1) 2.3s both,
          blink 1.8s ease-in-out 3.4s infinite;
      }
      .badge-halo {
        animation: glow 1.8s ease-in-out 3.4s infinite;
      }
      .badge-sparkles use {
        animation: twinkle 2.6s ease-in-out infinite both;
      }
      .badge-sparkles g:nth-child(1) use {
        animation-delay: 2.6s;
      }
      .badge-sparkles g:nth-child(2) use {
        animation-delay: 3.4s;
      }
      .badge-sparkles g:nth-child(3) use {
        animation-delay: 2.9s;
      }
      .badge-sparkles g:nth-child(4) use {
        animation-delay: 3.9s;
      }
      .badge-sparkles g:nth-child(5) use {
        animation-delay: 3.1s;
      }
      .badge-sparkles g:nth-child(6) use {
        animation-delay: 4.2s;
      }
      .badge-sparkles g:nth-child(7) use {
        animation-delay: 3.6s;
      }
      h1 {
        margin: clamp(18px, 3.5svh, 34px) 0 0;
        font:
          800 clamp(40px, min(7.4vw, 10svh), 96px) / 0.96 'Bricolage Grotesque',
          Manrope,
          system-ui,
          sans-serif;
        letter-spacing: -0.03em;
        text-wrap: balance;
        max-width: 14ch;
      }
      p {
        margin: clamp(16px, 2.6svh, 24px) auto clamp(24px, 4svh, 36px);
        max-width: 32ch;
        font-size: clamp(17px, 1.6vw, 19px);
        line-height: 1.55;
        color: var(--moss);
        text-wrap: balance;
      }
      .follow {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        min-height: 56px;
        padding: 0 28px;
        border-radius: var(--r-md);
        background: var(--forest);
        color: var(--paper);
        font:
          800 17px/1.2 Manrope,
          system-ui,
          sans-serif;
        text-decoration: none;
        box-shadow: var(--shadow-raise);
        transition:
          background 0.18s,
          transform 0.18s;
      }
      .follow:hover {
        background: var(--forest-hover);
        transform: translateY(-2px);
      }
      .follow:focus-visible,
      .brand:focus-visible,
      footer a:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }
      .follow svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }
      footer {
        font-size: 13px;
        color: var(--lichen);
      }
      footer .links {
        display: inline-flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px 18px;
      }
      footer a {
        color: var(--moss);
      }
      @keyframes drop {
        0% {
          translate: -60px -80svh;
          rotate: -12deg;
          opacity: 0;
        }
        12% {
          opacity: 1;
        }
        45% {
          rotate: 7deg;
        }
        75% {
          rotate: -3deg;
        }
        100% {
          translate: 0 0;
          rotate: 0deg;
          opacity: 1;
        }
      }
      @keyframes sway {
        0%,
        100% {
          rotate: 0deg;
          translate: 0 0;
        }
        25% {
          rotate: 5deg;
          translate: 0 -10px;
        }
        50% {
          rotate: 0deg;
          translate: 0 4px;
        }
        75% {
          rotate: -5deg;
          translate: 0 -10px;
        }
      }
      @keyframes light-up {
        from {
          opacity: 0;
          scale: 0.3;
        }
        to {
          opacity: 1;
          scale: 1;
        }
      }
      @keyframes glow {
        50% {
          opacity: 0.3;
          scale: 0.82;
        }
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.25;
        }
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0;
          scale: 0.2;
        }
        50% {
          opacity: 1;
          scale: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .parachute,
        .badge-light,
        .badge-halo,
        .badge-sparkles use {
          animation: none;
        }
        .follow {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="/" aria-label="Fistbump home">
        <img src="/favicon.svg" alt="" />
        fistbump
      </a>
    </header>
    <main>
      <div class="sky" aria-hidden="true">
        <span class="parachute">
          <img class="chute" src="/art/parachute.webp" alt="" width="286" height="275" />
          <svg class="badge" viewBox="0 0 286 400" width="286" height="400">
            <defs>
              <radialGradient id="badge-halo" cx="0" cy="0" r="120" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#ffd43b" stop-opacity=".9" />
                <stop offset=".48" stop-color="#ffd43b" stop-opacity=".55" />
                <stop offset=".72" stop-color="#f5bd4f" stop-opacity=".18" />
                <stop offset="1" stop-color="#f5bd4f" stop-opacity="0" />
              </radialGradient>
              <radialGradient id="badge-ray" cx="0" cy="0" r="100" gradientUnits="userSpaceOnUse">
                <stop offset=".5" stop-color="#ffc94a" stop-opacity=".8" />
                <stop offset="1" stop-color="#ffc94a" stop-opacity="0" />
              </radialGradient>
              <linearGradient id="badge-rim" y1="-60" y2="60" x2="0" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#b4f0c8" />
                <stop offset=".5" stop-color="#3c7d59" />
                <stop offset="1" stop-color="#0f2a1d" />
              </linearGradient>
              <radialGradient
                id="badge-body"
                cx="-20"
                cy="-28"
                r="88"
                gradientUnits="userSpaceOnUse"
              >
                <stop offset="0" stop-color="#5bb383" />
                <stop offset=".5" stop-color="#24553c" />
                <stop offset="1" stop-color="#10291d" />
              </radialGradient>
              <radialGradient id="badge-warm" cx="0" cy="0" r="48" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#ffd43b" stop-opacity=".45" />
                <stop offset="1" stop-color="#ffd43b" stop-opacity="0" />
              </radialGradient>
              <linearGradient
                id="badge-shine"
                y1="-56"
                y2="-16"
                x2="0"
                gradientUnits="userSpaceOnUse"
              >
                <stop offset="0" stop-color="#fff" stop-opacity=".7" />
                <stop offset="1" stop-color="#fff" stop-opacity="0" />
              </linearGradient>
              <linearGradient id="badge-spark" y1="-8" y2="8" x2="0" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#fffbe0" />
                <stop offset="1" stop-color="#ffc21a" />
              </linearGradient>
              <filter id="badge-glow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur in="SourceAlpha" stdDeviation="2.6" result="blur" />
                <feFlood flood-color="#ffd43b" />
                <feComposite in2="blur" operator="in" result="gold" />
                <feMerge>
                  <feMergeNode in="gold" />
                  <feMergeNode in="gold" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
              <filter id="badge-soft" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="1.6" />
              </filter>
              <path id="badge-star" d="M0-8C1-2 2-1 8 0C2 1 1 2 0 8C-1 2-2 1-8 0C-2-1-1-2 0-8Z" />
            </defs>
            <!-- The parachute's strings, carried on down to the badge. -->
            <path
              d="M84.8 256L99.8 274.8M93.6 256L102.2 270.4M104 240L111.6 260.2M109 240L113.6 258.4M121.1 232L123.2 252.5M160.6 216L159.7 248.2M165.5 216L161.4 248.6M200.1 232L190.9 265.9M209.8 240L198.3 275.8M212.8 248L199.2 278.1M217.4 248L199 278.6"
              stroke="#c9cdcf"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <g transform="translate(148 304)">
              <g class="badge-light">
                <circle class="badge-halo" r="120" fill="url(#badge-halo)" />
                <path
                  class="badge-rays"
                  fill="url(#badge-ray)"
                  filter="url(#badge-soft)"
                  d="M0 0L-5.2-99.9L5.2-99.9ZM0 0L25.7-69.4L30.9-67.2ZM0 0L66.9-74.3L74.3-66.9ZM0 0L67.2-30.9L69.4-25.7ZM0 0L99.9-5.2L99.9 5.2ZM0 0L69.4 25.7L67.2 30.9ZM0 0L74.3 66.9L66.9 74.3ZM0 0L30.9 67.2L25.7 69.4ZM0 0L5.2 99.9L-5.2 99.9ZM0 0L-25.7 69.4L-30.9 67.2ZM0 0L-66.9 74.3L-74.3 66.9ZM0 0L-67.2 30.9L-69.4 25.7ZM0 0L-99.9 5.2L-99.9-5.2ZM0 0L-69.4-25.7L-67.2-30.9ZM0 0L-74.3-66.9L-66.9-74.3ZM0 0L-30.9-67.2L-25.7-69.4Z"
                />
              </g>
              <g class="badge-ball">
                <circle r="60" fill="url(#badge-rim)" />
                <circle r="54.5" fill="url(#badge-body)" />
                <circle r="48" fill="url(#badge-warm)" />
                <!-- The Fistbump logo, as in the app icon. -->
                <path
                  d="M7 24L13 18L20 18L24 23L24 29L18 32L12 30L7 33M41 24L35 18L28 18L24 23L24 29L30 32L36 30L41 33M19 18V24H15M29 18V24H33M24 10V13M16 11L18 14M32 11L30 14"
                  transform="translate(-52.8 -47.3) scale(2.2)"
                  fill="none"
                  stroke="#fffdf5"
                  stroke-width="2.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  filter="url(#badge-glow)"
                />
                <ellipse cy="-36" rx="38" ry="19" fill="url(#badge-shine)" />
              </g>
              <g class="badge-sparkles" fill="url(#badge-spark)">
                <g transform="translate(-96 -14) scale(2)"><use href="#badge-star" /></g>
                <g transform="translate(90 -40) scale(1.5)"><use href="#badge-star" /></g>
                <g transform="translate(104 26) scale(2.2)"><use href="#badge-star" /></g>
                <g transform="translate(-84 50) scale(1.4)"><use href="#badge-star" /></g>
                <g transform="translate(-44 84) scale(1.7)"><use href="#badge-star" /></g>
                <g transform="translate(60 78) scale(1.5)"><use href="#badge-star" /></g>
                <g transform="translate(-112 -64) scale(1.1)"><use href="#badge-star" /></g>
              </g>
            </g>
          </svg>
        </span>
      </div>
      <h1>Fistbump is coming soon.</h1>
      <p>A new app for builders. The first look goes out on X.</p>
      <a class="follow" href="https://x.com/skatalystai" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3l-4.9-7.4L5.5 22H2.3l7.4-8.5L1 2h6.5l4.5 6.8L18.9 2Zm-1.1 18h1.7L6.6 3.9H4.8L17.8 20Z"
          />
        </svg>
        Follow @skatalystai on X
      </a>
    </main>
    <footer>
      <span class="links">
        <a href="/privacy/">Privacy</a>
        <a href="/terms/">Terms</a><a href="/support/">Support</a><a href="/contact/">Contact</a
        ><a href="/impressum/">Impressum</a>
        <a href="https://app.fistbump.world/sponsor">Become a World Partner</a>
        <span>© 2026 Fistbump</span>
      </span>
    </footer>
    <script>
      // One visit to this page, added to a daily total for the team (public.count_visit), and while
      // the page is in front one beat a minute to that minute's total, for "online now"
      // (public.site_beat). No cookie, nothing stored in the browser, nothing about the visitor is
      // sent or kept. The key is the app's public one, the same as in app.fistbump.world.
      (function () {
        var server = 'https://xhuhqgfvrtgdiqsxekig.supabase.co/rest/v1/rpc/';
        var publishable = 'sb_publishable_MYZH6o37FvHN8azleJ57rA_O2DA0aAM';
        var last = 0;
        function send(name, body) {
          fetch(server + name, {
            method: 'POST',
            headers: { apikey: publishable, 'Content-Type': 'application/json' },
            body: body,
            keepalive: true,
            credentials: 'omit',
            referrerPolicy: 'no-referrer',
          }).catch(function () {});
        }
        function beat() {
          if (document.visibilityState !== 'visible' || Date.now() - last < 55000) return;
          last = Date.now();
          send('site_beat', '{}');
        }
        send('count_visit', '{"page":"website","surface":"web"}');
        beat();
        setInterval(beat, 60000);
        document.addEventListener('visibilitychange', beat);
      })();
    </script>
  </body>
</html>
