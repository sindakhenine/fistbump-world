<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fistbump</title>
    <meta
      name="description"
      content="Fistbump, a new app for builders, is coming soon."
    />
    <meta name="theme-color" content="#FAFBF6" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://fistbump.world/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fistbump.world/" />
    <meta property="og:site_name" content="Fistbump" />
    <meta property="og:title" content="Fistbump" />
    <meta property="og:description" content="A new app for builders, coming soon." />
    <meta property="og:image" content="https://fistbump.world/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A small parachute drifting down with a crate stamped with the Fistbump mark."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@skatalystai" />
    <meta name="twitter:title" content="Fistbump" />
    <meta name="twitter:description" content="A new app for builders, coming soon." />
    <meta name="twitter:image" content="https://fistbump.world/og.png" />
    <!-- The colours: the same chart as the app (src/theme/tokens.css). -->
    <link rel="stylesheet" href="/tokens.css" />
    <link
      rel="preload"
      href="/fonts/BricolageGrotesque_800ExtraBold.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <style>
      @font-face {
        font-family: 'Bricolage Grotesque';
        src: url('/fonts/BricolageGrotesque_800ExtraBold.ttf') format('truetype');
        font-weight: 800;
        font-display: swap;
      }
      @font-face {
        font-family: 'Manrope';
        src: url('/fonts/Manrope_500Medium.ttf') format('truetype');
        font-weight: 500;
        font-display: swap;
      }
      @font-face {
        font-family: 'Manrope';
        src: url('/fonts/Manrope_800ExtraBold.ttf') format('truetype');
        font-weight: 800;
        font-display: swap;
      }
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100svh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: var(--paper);
        color: var(--forest);
        font:
          500 16px/1.5 Manrope,
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      /* The logo sits where the app's does, with the same margin. */
      header,
      footer {
        padding: clamp(16px, 3svh, 26px) clamp(16px, 4vw, 40px);
      }
      footer {
        justify-content: flex-end;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--forest);
        text-decoration: none;
        font:
          800 24px/1 Manrope,
          system-ui,
          sans-serif;
        letter-spacing: -1.4px;
      }
      .brand img {
        width: 32px;
        height: 32px;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 8px 16px 24px;
      }
      /* The app's own 3D parachute and chest (the pictures members see when someone lands). */
      .sky {
        width: min(230px, 26svh, 50vw);
      }
      .parachute {
        position: relative;
        display: block;
        aspect-ratio: 286 / 330;
        transform-origin: 50% 14%;
        animation:
          drop 2.8s cubic-bezier(0.2, 0.75, 0.25, 1) both,
          sway 6s ease-in-out 2.8s infinite;
      }
      .parachute img {
        position: absolute;
        left: 50%;
        translate: -50% 0;
        height: auto;
      }
      .chute {
        top: 0;
        width: 100%;
        filter: drop-shadow(0 10px 14px #1e3a2c26);
      }
      .chest {
        bottom: 0;
        width: 42%;
        filter: drop-shadow(0 8px 10px #1e3a2c33);
      }
      h1 {
        margin: clamp(18px, 3.5svh, 34px) 0 0;
        font:
          800 clamp(40px, min(7.4vw, 10svh), 96px) / 0.96 'Bricolage Grotesque',
          Manrope,
          system-ui,
          sans-serif;
        letter-spacing: -0.03em;
        text-wrap: balance;
        max-width: 14ch;
      }
      p {
        margin: clamp(16px, 2.6svh, 24px) auto clamp(24px, 4svh, 36px);
        max-width: 32ch;
        font-size: clamp(17px, 1.6vw, 19px);
        line-height: 1.55;
        color: var(--moss);
        text-wrap: balance;
      }
      .follow {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        min-height: 56px;
        padding: 0 28px;
        border-radius: var(--r-md);
        background: var(--forest);
        color: var(--paper);
        font:
          800 17px/1.2 Manrope,
          system-ui,
          sans-serif;
        text-decoration: none;
        box-shadow: var(--shadow-raise);
        transition:
          background 0.18s,
          transform 0.18s;
      }
      .follow:hover {
        background: var(--forest-hover);
        transform: translateY(-2px);
      }
      .follow:focus-visible,
      .brand:focus-visible,
      footer a:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }
      .follow svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }
      footer {
        font-size: 13px;
        color: var(--lichen);
      }
      footer .links {
        display: inline-flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px 18px;
      }
      footer a {
        color: var(--moss);
      }
      @keyframes drop {
        0% {
          translate: -60px -80svh;
          rotate: -12deg;
          opacity: 0;
        }
        12% {
          opacity: 1;
        }
        45% {
          rotate: 7deg;
        }
        75% {
          rotate: -3deg;
        }
        100% {
          translate: 0 0;
          rotate: 0deg;
          opacity: 1;
        }
      }
      @keyframes sway {
        0%,
        100% {
          rotate: 0deg;
        }
        25% {
          rotate: 2.5deg;
        }
        75% {
          rotate: -2.5deg;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .parachute {
          animation: none;
        }
        .follow {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="/" aria-label="Fistbump home">
        <img src="/favicon.svg" alt="" />
        fistbump
      </a>
    </header>
    <main>
      <div class="sky" aria-hidden="true">
        <span class="parachute">
          <img class="chute" src="/art/parachute.webp" alt="" width="286" height="275" />
          <img class="chest" src="/art/chest.webp" alt="" width="331" height="342" />
        </span>
      </div>
      <h1>Fistbump is coming soon.</h1>
      <p>A new app for builders. The first look goes out on X.</p>
      <a class="follow" href="https://x.com/skatalystai" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3l-4.9-7.4L5.5 22H2.3l7.4-8.5L1 2h6.5l4.5 6.8L18.9 2Zm-1.1 18h1.7L6.6 3.9H4.8L17.8 20Z"
          />
        </svg>
        Follow @skatalystai on X
      </a>
    </main>
    <footer>
      <span class="links">
        <a href="/privacy/">Privacy</a>
        <a href="/terms/">Terms</a><a href="/support/">Support</a><a href="/impressum/">Impressum</a>
        <a href="https://app.fistbump.world/sponsor">Become a World Partner</a>
        <span>© 2026 Fistbump</span>
      </span>
    </footer>
    <script>
      // One visit to this page, added to a daily total for the team (public.count_visit), and while
      // the page is in front one beat a minute to that minute's total, for "online now"
      // (public.site_beat). No cookie, nothing stored in the browser, nothing about the visitor is
      // sent or kept. The key is the app's public one, the same as in app.fistbump.world.
      (function () {
        var server = 'https://xhuhqgfvrtgdiqsxekig.supabase.co/rest/v1/rpc/';
        var publishable = 'sb_publishable_MYZH6o37FvHN8azleJ57rA_O2DA0aAM';
        var last = 0;
        function send(name, body) {
          fetch(server + name, {
            method: 'POST',
            headers: { apikey: publishable, 'Content-Type': 'application/json' },
            body: body,
            keepalive: true,
            credentials: 'omit',
            referrerPolicy: 'no-referrer',
          }).catch(function () {});
        }
        function beat() {
          if (document.visibilityState !== 'visible' || Date.now() - last < 55000) return;
          last = Date.now();
          send('site_beat', '{}');
        }
        send('count_visit', '{"page":"website","surface":"web"}');
        beat();
        setInterval(beat, 60000);
        document.addEventListener('visibilitychange', beat);
      })();
    </script>
  </body>
</html>
