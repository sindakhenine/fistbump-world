    <style>
      @font-face {
        font-family: 'Bricolage Grotesque';
        src: url('/fonts/BricolageGrotesque_800ExtraBold.ttf') format('truetype');
        font-weight: 800;
        font-display: swap;
      }
      @font-face {
        font-family: 'Manrope';
        src: url('/fonts/Manrope_500Medium.ttf') format('truetype');
        font-weight: 500;
        font-display: swap;
      }
      @font-face {
        font-family: 'Manrope';
        src: url('/fonts/Manrope_800ExtraBold.ttf') format('truetype');
        font-weight: 800;
        font-display: swap;
      }
      :root {
        --paper: #fafbf6;
        --forest: #1e3a2c;
        --forest-hover: #2d4f3d;
        --moss: #46594d;
        --lichen: #5f7266;
        --lagoon: #5b948b;
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100svh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: var(--paper);
        color: var(--forest);
        font: 500 16px/1.5 Manrope, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: clamp(16px, 3svh, 26px) clamp(16px, 4vw, 40px);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--forest);
        text-decoration: none;
        font: 800 27px/1 Manrope, system-ui, sans-serif;
        letter-spacing: -1.4px;
      }
      .brand img {
        width: 32px;
        height: 32px;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 8px 16px 24px;
      }
      .sky {
        width: min(220px, 24svh, 46vw);
        overflow: visible;
      }
      .parachute {
        transform-origin: 50% 14%;
        animation:
          drop 2.8s cubic-bezier(0.2, 0.75, 0.25, 1) both,
          sway 6s ease-in-out 2.8s infinite;
      }
      h1 {
        margin: clamp(18px, 3.5svh, 34px) 0 0;
        font: 800 clamp(40px, min(7.4vw, 10svh), 96px) / 0.96 'Bricolage Grotesque', Manrope,
          system-ui, sans-serif;
        letter-spacing: -0.03em;
        text-wrap: balance;
        max-width: 14ch;
      }
      p {
        margin: clamp(16px, 2.6svh, 24px) auto clamp(24px, 4svh, 36px);
        max-width: 32ch;
        font-size: clamp(17px, 1.6vw, 19px);
        line-height: 1.55;
        color: var(--moss);
        text-wrap: balance;
      }
      .follow {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        min-height: 60px;
        padding: 0 28px;
        border-radius: 18px;
        background: var(--forest);
        color: var(--paper);
        font: 800 17px/1.2 Manrope, system-ui, sans-serif;
        text-decoration: none;
        box-shadow:
          0 1px 0 #ffffff1f inset,
          0 10px 24px #1e3a2c2e;
        transition:
          background 0.18s,
          transform 0.18s;
      }
      .follow:hover {
        background: var(--forest-hover);
        transform: translateY(-2px);
      }
      .follow:focus-visible,
      .brand:focus-visible {
        outline: 3px solid var(--lagoon);
        outline-offset: 4px;
      }
      .follow svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }
      footer {
        font-size: 13px;
        color: var(--lichen);
      }
      @keyframes drop {
        0% {
          translate: -60px -80svh;
          rotate: -12deg;
          opacity: 0;
        }
        12% {
          opacity: 1;
        }
        45% {
          rotate: 7deg;
        }
        75% {
          rotate: -3deg;
        }
        100% {
          translate: 0 0;
          rotate: 0deg;
          opacity: 1;
        }
      }
      @keyframes sway {
        0%,
        100% {
          rotate: 0deg;
        }
        25% {
          rotate: 2.5deg;
        }
        75% {
          rotate: -2.5deg;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .parachute {
          animation: none;
        }
        .follow {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header>

        fistbump

            <path d="M222 104L143 214M181.2 104L141 214M140.4 104L138 214" />
